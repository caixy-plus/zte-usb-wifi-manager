name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run checks
        run: make check

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        openwrt:
          - '25.12.5'
          - '24.10.7'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenWrt SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Build packages
        run: ./scripts/build-openwrt-packages.sh '${{ matrix.openwrt }}' output

      - name: Upload release-specific packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.openwrt }}
          path: output/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release-specific packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: incoming

      - name: Assemble checksummed package bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for pattern in \
            'zte-usb-wifi-manager_*_all.apk' \
            'luci-app-zte-usb-wifi-manager_*_all.apk' \
            'zte-usb-wifi-manager_*_all.ipk' \
            'luci-app-zte-usb-wifi-manager_*_all.ipk'; do
            mapfile -t matches < <(find incoming -type f -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected one artifact matching $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" dist/
          done
          mapfile -t manifests < <(
            find incoming -type f -name build-manifest.json -print | sort
          )
          if [ "${#manifests[@]}" -ne 2 ]; then
            echo "expected two build manifests, found ${#manifests[@]}" >&2
            exit 1
          fi
          node - "$GITHUB_SHA" "${manifests[@]}" <<'NODE'
          const fs = require('fs');
          const [sourceCommit, ...paths] = process.argv.slice(2);
          const builds = paths.map(path => JSON.parse(fs.readFileSync(path, 'utf8')));
          fs.writeFileSync('dist/build-manifest.json', JSON.stringify({
            source_commit: sourceCommit,
            builds
          }, null, 2) + '\n');
          NODE
          (
            cd dist
            sha256sum ./*.apk ./*.ipk build-manifest.json >SHA256SUMS
          )

      - name: Upload complete package bundle
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download complete package bundle
        uses: actions/download-artifact@v4
        with:
          name: openwrt-packages
          path: dist

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Read-only developer preview for OpenWrt 25.12.5 and 24.10.7.' \
            '' \
            'Verify downloaded files with SHA256SUMS before installation.' \
            >release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
