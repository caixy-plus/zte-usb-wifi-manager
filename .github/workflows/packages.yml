name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.0-rc1-r13'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run checks
        run: make check

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        openwrt:
          - '25.12.5'
          - '24.10.7'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenWrt SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Build packages
        run: ./scripts/build-openwrt-packages.sh '${{ matrix.openwrt }}' output

      - name: Upload release-specific packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.openwrt }}
          path: output/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release-specific packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: incoming

      - name: Assemble checksummed package bundle
        run: |
          node scripts/assemble-openwrt-packages.js \
            incoming dist "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Upload complete package bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download complete package bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openwrt-packages
          path: dist

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Safety-gated developer preview for OpenWrt 25.12.5 and 24.10.7.' \
            'Backend r13 accepts the target U25S modem_init_complete ready state while preserving the r12 HAS_LOGIN:false anonymous-auth contract, bounded readback, and calibration gates; production device writes and USB power remain calibration-gated.' \
            '' \
            'Verify downloaded files with SHA256SUMS before installation.' \
            >release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
